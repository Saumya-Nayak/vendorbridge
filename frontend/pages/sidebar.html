<!DOCTYPE html>
<!--
  VendorBridge — Sidebar Component
  ─────────────────────────────────
  HOW TO USE IN ANY PAGE:
  1. Add <div id="sidebar-root"></div> at the top of your .page-wrapper
  2. Add <div class="sidebar-overlay" id="sidebar-overlay"></div> right after
  3. Include this at the bottom of your <body>:
       <script src="../assets/js/sidebar-loader.js"></script>
  4. Mark the correct nav-item as active by passing the page name:
       window.SIDEBAR_ACTIVE = 'dashboard'; // or 'vendors', 'rfqs', etc.
     (set this BEFORE including sidebar-loader.js)
-->

<!-- ═══════════════════════════════════════════════════════════════
     SIDEBAR STYLES  (scoped so they don't bleed into host pages)
════════════════════════════════════════════════════════════════ -->
<style id="vb-sidebar-styles">
  /* ── Sidebar shell ── */
  .sidebar {
    width: 240px;
    min-height: 100vh;
    background: var(--bg-sidebar);
    border-right: 1px solid var(--border-primary);
    display: flex;
    flex-direction: column;
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    z-index: 100;
    transition: transform 0.25s ease;
  }

  /* ── Logo ── */
  .sidebar-logo {
    padding: 20px 18px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid var(--border-primary);
    min-height: 64px;
    text-decoration: none;
  }
  .sidebar-logo .logo-icon {
    width: 34px;
    height: 34px;
    background: var(--accent-primary);
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Syne", sans-serif;
    font-size: 15px;
    font-weight: 800;
    color: #fff;
    flex-shrink: 0;
    box-shadow: 0 4px 12px rgba(79, 142, 247, 0.3);
  }
  .sidebar-logo .logo-text {
    font-family: "Syne", sans-serif;
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--text-primary);
  }
  .sidebar-logo .logo-text em {
    color: var(--accent-primary);
    font-style: normal;
  }

  /* ── Nav ── */
  .sidebar-nav {
    flex: 1;
    padding: 10px 8px;
    overflow-y: auto;
  }
  .nav-section-label {
    font-size: 0.65rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
    padding: 12px 10px 4px;
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 10px;
    font-size: 0.875rem;
    font-weight: 500;
    color: var(--text-secondary);
    text-decoration: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.18s ease, color 0.18s ease;
    position: relative;
    margin-bottom: 2px;
  }
  .nav-item:hover {
    background: var(--bg-tertiary);
    color: var(--text-primary);
    text-decoration: none;
  }
  .nav-item.active {
    color: var(--accent-primary);
    background: var(--accent-primary-light);
  }
  .nav-item .nav-icon {
    font-size: 1rem;
    width: 20px;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .nav-badge {
    margin-left: auto;
    background: var(--accent-primary);
    color: #fff;
    font-size: 0.65rem;
    font-weight: 700;
    padding: 1px 7px;
    border-radius: 100px;
    min-width: 20px;
    text-align: center;
  }

  /* ── Footer / User block ── */
  .sidebar-footer {
    padding: 12px 8px;
    border-top: 1px solid var(--border-primary);
  }
  .sidebar-user {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.18s ease;
    position: relative;
  }
  .sidebar-user:hover {
    background: var(--bg-tertiary);
  }

  .user-avatar {
    width: 34px;
    height: 34px;
    background: linear-gradient(135deg, var(--accent-primary), #7c5fcf);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    font-weight: 700;
    color: #fff;
    flex-shrink: 0;
  }
  .user-info {
    flex: 1;
    min-width: 0;
  }
  .user-name {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .user-role {
    font-size: 0.68rem;
    color: var(--text-muted);
  }

  /* ── Settings gear button ── */
  .user-settings-btn {
    width: 26px;
    height: 26px;
    border: none;
    background: none;
    color: var(--text-muted);
    font-size: 0.9rem;
    cursor: pointer;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s, color 0.15s;
  }
  .user-settings-btn:hover {
    background: var(--accent-primary-light);
    color: var(--accent-primary);
  }

  /* ── Settings flyout ── */
  .settings-flyout {
    display: none;
    position: absolute;
    bottom: calc(100% + 8px);
    left: 8px;
    right: 8px;
    background: var(--bg-card);
    border: 1px solid var(--border-primary);
    border-radius: 12px;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
    z-index: 200;
    overflow: hidden;
    animation: flyoutIn 0.18s ease;
  }
  .settings-flyout.open {
    display: block;
  }

  @keyframes flyoutIn {
    from {
      opacity: 0;
      transform: translateY(6px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .flyout-header {
    padding: 12px 14px 8px;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
    border-bottom: 1px solid var(--border-primary);
  }

  .flyout-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    font-size: 0.82rem;
    font-weight: 500;
    color: var(--text-secondary);
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
    border-bottom: 1px solid var(--border-secondary);
    text-decoration: none;
  }
  .flyout-item:last-child {
    border-bottom: none;
  }
  .flyout-item:hover {
    background: var(--bg-tertiary);
    color: var(--text-primary);
  }
  .flyout-item.danger {
    color: var(--accent-danger, #ef4444);
  }
  .flyout-item.danger:hover {
    background: rgba(239, 68, 68, 0.08);
  }

  .flyout-item .fi-icon {
    width: 28px;
    height: 28px;
    border-radius: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.85rem;
    flex-shrink: 0;
    background: var(--bg-tertiary);
  }

  /* ── Theme toggle row ── */
  .flyout-theme-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border-secondary);
  }
  .flyout-theme-label {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.82rem;
    font-weight: 500;
    color: var(--text-secondary);
  }
  .flyout-theme-label .fi-icon {
    width: 28px;
    height: 28px;
    border-radius: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.85rem;
    background: var(--bg-tertiary);
  }

  /* Toggle pill */
  .theme-toggle-pill {
    width: 38px;
    height: 21px;
    background: var(--bg-tertiary);
    border: 1px solid var(--border-primary);
    border-radius: 100px;
    cursor: pointer;
    position: relative;
    transition: background 0.25s;
    flex-shrink: 0;
  }
  .theme-toggle-pill.dark-on {
    background: var(--accent-primary);
    border-color: var(--accent-primary);
  }
  .theme-toggle-pill::after {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 15px;
    height: 15px;
    border-radius: 50%;
    background: #fff;
    transition: transform 0.25s;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
  }
  .theme-toggle-pill.dark-on::after {
    transform: translateX(17px);
  }

  /* ── Overlay ── */
  .sidebar-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 99;
    background: rgba(0, 0, 0, 0.5);
  }
  .sidebar-overlay.show {
    display: block;
  }

  /* ── Responsive ── */
  @media (max-width: 900px) {
    .sidebar {
      transform: translateX(-100%);
    }
    .sidebar.open {
      transform: translateX(0);
    }
  }
</style>

<!-- ═══════════════════════════════════════════════════════════════
     SIDEBAR LOGIC
════════════════════════════════════════════════════════════════ -->
<script>
  (function () {
    "use strict";

    /* ── Active nav highlight ─────────────────────────────────── */
    function highlightActive() {
      // Priority: 1) window.SIDEBAR_ACTIVE  2) URL filename
      const active =
        window.SIDEBAR_ACTIVE ||
        location.pathname.split("/").pop().replace(".html", "") ||
        "dashboard";

      document
        .querySelectorAll(".sidebar .nav-item[data-page]")
        .forEach((el) => {
          el.classList.toggle("active", el.dataset.page === active);
        });
    }
    highlightActive();

    /* ── User info ────────────────────────────────────────────── */
    function vendorInitials(name) {
      return (name || "V")
        .split(" ")
        .map((w) => w[0])
        .slice(0, 2)
        .join("")
        .toUpperCase();
    }

    function applyUser(u) {
      const name =
        `${u.first_name || ""} ${u.last_name || ""}`.trim() ||
        u.email ||
        "User";
      const el = (id) => document.getElementById(id);
      if (el("sidebar-user-name")) el("sidebar-user-name").textContent = name;
      if (el("sidebar-user-role"))
        el("sidebar-user-role").textContent = (u.role || "")
          .replace(/_/g, " ")
          .replace(/\b\w/g, (c) => c.toUpperCase());
      if (el("user-avatar-initials"))
        el("user-avatar-initials").textContent = vendorInitials(name);
    }

    function loadUser() {
      const cached = localStorage.getItem("vb_user");
      if (cached) {
        try {
          applyUser(JSON.parse(cached));
        } catch {}
        return;
      }
      // Demo fallback
      applyUser({
        first_name: "Procurement",
        last_name: "Officer",
        role: "procurement_officer",
      });
    }
    loadUser();

    /* ── Settings flyout toggle ───────────────────────────────── */
    const flyout = document.getElementById("settings-flyout");
    const gearBtn = document.getElementById("settings-gear-btn");

    function closeFlyout() {
      flyout && flyout.classList.remove("open");
    }

    if (gearBtn && flyout) {
      gearBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        flyout.classList.toggle("open");
      });
      // Also open flyout when clicking anywhere on user row EXCEPT the gear (UX bonus)
      document
        .getElementById("user-profile-btn")
        ?.addEventListener("click", function (e) {
          if (e.target === gearBtn || gearBtn.contains(e.target)) return;
          flyout.classList.toggle("open");
        });
    }

    // Close flyout on outside click
    document.addEventListener("click", function (e) {
      if (flyout && flyout.classList.contains("open")) {
        if (!flyout.contains(e.target) && !gearBtn?.contains(e.target)) {
          closeFlyout();
        }
      }
    });

    // Sign out from flyout
    document
      .getElementById("flyout-logout-btn")
      ?.addEventListener("click", function () {
        // Dispatch event so host page can show its logout modal / handle it
        window.dispatchEvent(new CustomEvent("vb:logout"));
        // Fallback: open modal if it exists directly
        document.getElementById("logout-modal")?.classList.add("show");
        closeFlyout();
      });

    /* ── Theme toggle (pill inside flyout) ───────────────────────
     Works alongside whatever ThemeManager the host page loads.
     Reads / writes the same data-theme attribute on <html>.     */
    const pill = document.getElementById("theme-pill");
    const themeIcon = document.getElementById("theme-flyout-icon");

    function syncPill() {
      const isDark =
        document.documentElement.getAttribute("data-theme") === "dark";
      pill?.classList.toggle("dark-on", isDark);
      if (themeIcon) themeIcon.textContent = isDark ? "🌙" : "☀️";
    }
    syncPill();

    pill?.addEventListener("click", function () {
      const isDark =
        document.documentElement.getAttribute("data-theme") === "dark";
      const next = isDark ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("vb_theme", next);
      syncPill();
      // Also notify ThemeManager if it exists on the page
      if (window.ThemeManager) window.ThemeManager.apply(next);
    });

    // Keep pill in sync if ThemeManager changes theme externally
    const observer = new MutationObserver(syncPill);
    observer.observe(document.documentElement, {
      attributes: true,
      attributeFilter: ["data-theme"],
    });

    /* ── Mobile overlay close ─────────────────────────────────── */
    document
      .getElementById("sidebar-overlay")
      ?.addEventListener("click", () => {
        document.getElementById("sidebar")?.classList.remove("open");
        document.getElementById("sidebar-overlay")?.classList.remove("show");
      });
  })();
</script>
